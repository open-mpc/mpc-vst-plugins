# Checks the zips the catalog lists for device-side text the MPC cannot read: CR line endings or a UTF-8 BOM, which stop
# the device's sh and awk at the first line of code (a Windows-built package shipped exactly that once, see
# docs/RELEASING.md). Weekly, after the nightly catalog build, and on demand. The job fails while a published package has
# the problem, and also when a package could not be read at all (exit 2: a network or API failure, not a defect), so a red
# run never means "broken". Both reports stay as an artifact, so a release built with an old copy of the tools shows up.
name: Catalog text scan

on:
  schedule:
    - cron: '23 4 * * 1'   # Mondays, after the nightly build (03:17 UTC)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Scan the published packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          python3 tools/catalog_text_scan.py --json text-scan.json | tee text-scan.txt
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-text-scan
          path: |
            text-scan.json
            text-scan.txt
